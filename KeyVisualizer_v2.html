<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QMK Wiring Visualizer 2.0 (Handwire Edition)</title>
    <style>
        :root {
            --bg-color: #1e1e2e;
            --panel-bg: #181825;
            --key-bg: #313244;
            --key-hover: #a6e3a1;
            --text-main: #cdd6f4;
            --text-sub: #a6adc8;
            --accent: #f38ba8;
            --bottom-view: #fab387;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: var(--bg-color);
            color: var(--text-main);
            padding: 2rem;
            margin: 0;
        }
        .header {
            margin-bottom: 1.5rem;
            border-bottom: 2px solid var(--key-bg);
            padding-bottom: 1rem;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .controls {
            display: flex;
            gap: 15px;
            align-items: center;
            background: var(--panel-bg);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--key-bg);
            flex-wrap: wrap;
        }
        select, input[type="file"], input[type="text"], button {
            background: var(--key-bg);
            padding: 0.5rem 1rem;
            border-radius: 6px;
            border: 1px solid #11111b;
            color: var(--text-main);
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.2s ease;
        }
        button:hover {
            filter: brightness(1.2);
        }
        #viewToggle {
            margin-left: auto; /* Pushes button to the right */
        }
        #stage {
            position: relative;
            background: var(--panel-bg);
            border-radius: 12px;
            padding: 20px;
            margin-top: 20px;
            overflow: auto;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            min-height: 200px;
            transition: background 0.3s ease;
        }
        .key {
            position: absolute;
            background: var(--key-bg);
            border: 2px solid #11111b;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: monospace;
            box-sizing: border-box;
            transition: all 0.2s ease;
            cursor: crosshair;
            box-shadow: inset 0 2px 0 rgba(255,255,255,0.1);
        }
        .key:hover {
            background: var(--key-hover);
            color: #11111b;
            transform: translateY(-2px);
            z-index: 10;
        }
        .matrix { font-size: 13px; font-weight: bold; pointer-events: none; white-space: nowrap;}
        .pins { font-size: 9px; color: var(--accent); margin-top: 4px; pointer-events: none; font-weight: bold; white-space: nowrap;}
        .key:hover .pins { color: #11111b; }
        .keycode { font-size: 11px; font-weight: bold; pointer-events: none; max-width: 90%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: center; color: var(--text-main); }
        .key:hover .keycode { color: #11111b; }

        #tooltip {
            position: fixed;
            background: rgba(17, 17, 27, 0.95);
            color: #a6e3a1;
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid #a6e3a1;
            pointer-events: none;
            display: none;
            z-index: 100;
            font-family: monospace;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            white-space: pre-line;
        }
        .peripherals-panel {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(24, 24, 37, 0.95);
            border: 1px solid var(--key-bg);
            border-radius: 8px;
            padding: 15px;
            z-index: 20;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            font-family: monospace;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .peripheral-item {
            border-left: 3px solid var(--accent);
            padding-left: 10px;
        }
        .peripheral-title {
            font-weight: bold;
            color: var(--text-main);
            margin-bottom: 5px;
        }
        .peripheral-pin {
            font-size: 12px;
            color: var(--text-sub);
        }
        .peripheral-pin strong {
            color: var(--key-hover);
        }
        .encoder-key {
            border-radius: 50% !important;
            background: #45475a !important;
            border: 3px dashed var(--accent) !important;
        }
        .assigning-mode .key {
            cursor: crosshair !important;
        }
        .assigning-mode .key:hover {
            box-shadow: 0 0 0 3px rgba(243, 139, 168, 0.5);
        }
    </style>
</head>
<body>

    <div class="header">
        <div>
            <h2 style="margin: 0 0 5px 0;">⌨️ QMK Wiring Visualizer 2.0</h2>
            <span style="color: var(--text-sub);">Map your physical layout directly to microcontroller pins.</span>
        </div>

        <div class="controls">
            <div style="display:flex; flex-direction:column; gap:5px;">
                <label style="font-size:12px; color:var(--text-sub);">QMK API Search:</label>
                <div style="display:flex; gap: 5px;">
                    <input type="text" id="qmkSearch" placeholder="e.g. lily58/rev1" style="width: 150px; font-family: monospace;">
                    <button id="fetchQmkBtn" style="padding: 0.5rem; background: var(--accent); color: #11111b;">Fetch</button>
                </div>
            </div>

            <div style="display:flex; flex-direction:column; gap:5px;">
                <label style="font-size:12px; color:var(--text-sub);">Local JSON (Optional):</label>
                <div style="display:flex; gap: 5px;">
                    <input type="file" id="upload" accept=".json" style="max-width: 150px;" title="Upload QMK info.json">
                    <button id="importKleBtn" style="padding: 0.5rem; background: var(--peach, #fab387); color: #11111b;" title="Import raw KLE Layout">Import KLE</button>
                </div>
            </div>

            <div style="display:flex; flex-direction:column; gap:5px;">
                <label style="font-size:12px; color:var(--text-sub);">keymap.c (Optional):</label>
                <div style="display:flex; gap: 5px;">
                    <input type="file" id="keymapUpload" accept=".c,.json" style="max-width: 150px;">
                    <button id="fetchKeymapBtn" style="padding: 0.5rem; background: var(--accent); color: #11111b; display: none;">⬇️ Fetch</button>
                    <select id="layerSelect" style="display:none;"></select>
                </div>
            </div>

            <label for="boardSelect">MCU Profile:</label>
            <select id="boardSelect">
                <option value="json_file">📄 Read Pins from JSON</option>
                <option value="waveshare_2040_plus">Waveshare RP2040 Plus (Split)</option>
                <option value="rp2040_zero">Waveshare RP2040 Zero (Split)</option>
                <option value="rp2040_tiny">Waveshare RP2040 Tiny (Split)</option>
                <option value="pro_micro">Arduino Pro Micro (ATmega32U4)</option>
                <option value="nice_nano">nice!nano v2.0 (nRF52840)</option>
                <option value="nrf52840_nicenano_clone">SuperMini nRF52840 (nice!nano Clone)</option>
            </select>

            <label style="margin-left: 15px; display: flex; align-items: center; gap: 5px; cursor: pointer; color: var(--text-sub); font-size: 14px; font-weight: bold;">
                <input type="checkbox" id="showWiring"> Show Wiring
            </label>

            <button id="viewToggle">👀 View: Top (Keycaps)</button>
            <button id="clearAllBtn" style="margin-left: 10px; background: var(--red, #f38ba8); color: #11111b; font-weight: bold;">🗑️ Clear All</button>

        </div>
    </div>

    <div id="warningBanner" style="display:none; background: rgba(243, 139, 168, 0.2); border: 2px solid var(--accent); color: var(--accent); padding: 15px; border-radius: 8px; margin-top: 15px; font-weight: bold; text-align: center;"></div>

    <div id="stage"></div>
    <div id="tooltip"></div>


    <div id="kleModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:100; align-items:center; justify-content:center;">
        <div style="background:var(--bg); border:1px solid var(--peach, #fab387); border-radius:8px; padding:20px; width:600px; max-width:90%;">
            <h3 style="margin-top:0; color:var(--peach, #fab387);">Import KLE Layout</h3>
            <p style="font-size:12px; color:var(--text-sub);">Paste your raw JSON from <a href="https://editor.keyboard-tools.xyz/" target="_blank" style="color:var(--blue, #89b4fa);">editor.keyboard-tools.xyz</a> below. The visualizer will auto-route the matrix based on physical positions.</p>
            
            <label style="display:block; margin-bottom:10px; font-size:14px; color:var(--text-main);">
                <input type="checkbox" id="kleIsSplit" checked> Is this a Split Keyboard? (Check if it has left/right halves)
            </label>
            
            <div style="margin-bottom: 15px; display:flex; flex-direction:column; gap:5px;">
                <label style="font-size:12px; color:var(--text-sub);">Target Microcontroller:</label>
                <select id="kleBoardSelect" style="width: 100%; padding: 5px; background: #11111b; color: var(--text-main); border: 1px solid var(--key-bg);">
                    <option value="auto">Auto-Select (Best Fit)</option>
                    <option value="waveshare_2040_plus">Waveshare RP2040-Plus</option>
                    <option value="rp2040_zero">RP2040 Zero</option>
                    <option value="rp2040_tiny">RP2040 Tiny</option>
                    <option value="pro_micro">Pro Micro (ATmega32U4)</option>
                    <option value="nice_nano">nice!nano</option>
                    <option value="nrf52840_nicenano_clone">SuperMini nRF52840</option>
                </select>
            </div>
            
            <textarea id="kleInput" placeholder='[["Esc","Q","W","E"...]]' style="width:100%; height:200px; background:#11111b; color:var(--text-main); border:1px solid var(--key-bg); padding:10px; font-family:monospace; margin-bottom:10px; resize:none; box-sizing: border-box;"></textarea>
            
            <div style="display:flex; justify-content:flex-end; gap:10px;">
                <button id="processKleBtn" style="background:var(--peach, #fab387); color:#11111b;">🚀 Auto-Route Matrix</button>
                <button id="closeKleModalBtn" style="background:var(--key-bg); color:var(--text-main);">Cancel</button>
            </div>
        </div>
    </div>

    <script src="KeyVisualizer_v2.js?v=2"></script>
</body>
</html>
