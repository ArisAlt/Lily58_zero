<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QMK Wiring Visualizer 2.0 (Handwire Edition)</title>
    <style>
        :root {
            --bg-color: #1e1e2e;
            --panel-bg: #181825;
            --key-bg: #313244;
            --key-hover: #a6e3a1;
            --text-main: #cdd6f4;
            --text-sub: #a6adc8;
            --accent: #f38ba8;
            --bottom-view: #fab387;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: var(--bg-color);
            color: var(--text-main);
            padding: 2rem;
            margin: 0;
        }
        .header {
            margin-bottom: 1.5rem;
            border-bottom: 2px solid var(--key-bg);
            padding-bottom: 1rem;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .controls {
            display: flex;
            gap: 15px;
            align-items: center;
            background: var(--panel-bg);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--key-bg);
            flex-wrap: wrap;
        }
        select, input[type="file"], button {
            background: var(--key-bg);
            padding: 0.5rem 1rem;
            border-radius: 6px;
            border: 1px solid #11111b;
            color: var(--text-main);
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.2s ease;
        }
        button:hover {
            filter: brightness(1.2);
        }
        #viewToggle {
            margin-left: auto; /* Pushes button to the right */
        }
        #stage {
            position: relative;
            background: var(--panel-bg);
            border-radius: 12px;
            padding: 20px;
            margin-top: 20px;
            overflow: auto;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            min-height: 200px;
            transition: background 0.3s ease;
        }
        .key {
            position: absolute;
            background: var(--key-bg);
            border: 2px solid #11111b;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: monospace;
            box-sizing: border-box;
            transition: all 0.2s ease;
            cursor: crosshair;
            box-shadow: inset 0 2px 0 rgba(255,255,255,0.1);
        }
        .key:hover {
            background: var(--key-hover);
            color: #11111b;
            transform: translateY(-2px);
            z-index: 10;
        }
        .matrix { font-size: 14px; font-weight: bold; pointer-events: none;}
        .pins { font-size: 10px; color: var(--accent); margin-top: 4px; pointer-events: none; font-weight: bold;}
        .key:hover .pins { color: #11111b; }
        .keycode { font-size: 11px; font-weight: bold; pointer-events: none; max-width: 90%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: center; color: var(--text-main); }
        .key:hover .keycode { color: #11111b; }

        #tooltip {
            position: fixed;
            background: rgba(17, 17, 27, 0.95);
            color: #a6e3a1;
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid #a6e3a1;
            pointer-events: none;
            display: none;
            z-index: 100;
            font-family: monospace;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            white-space: pre-line;
        }
        .peripherals-panel {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(24, 24, 37, 0.95);
            border: 1px solid var(--key-bg);
            border-radius: 8px;
            padding: 15px;
            z-index: 20;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            font-family: monospace;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .peripheral-item {
            border-left: 3px solid var(--accent);
            padding-left: 10px;
        }
        .peripheral-title {
            font-weight: bold;
            color: var(--text-main);
            margin-bottom: 5px;
        }
        .peripheral-pin {
            font-size: 12px;
            color: var(--text-sub);
        }
        .peripheral-pin strong {
            color: var(--key-hover);
        }
        .encoder-key {
            border-radius: 50% !important;
            background: #45475a !important;
            border: 3px dashed var(--accent) !important;
        }
        .assigning-mode .key {
            cursor: crosshair !important;
        }
        .assigning-mode .key:hover {
            box-shadow: 0 0 0 3px rgba(243, 139, 168, 0.5);
        }
    </style>
</head>
<body>

    <div class="header">
        <div>
            <h2 style="margin: 0 0 5px 0;">⌨️ QMK Wiring Visualizer 2.0</h2>
            <span style="color: var(--text-sub);">Map your physical layout directly to microcontroller pins.</span>
        </div>

        <div class="controls">
            <div style="display:flex; flex-direction:column; gap:5px;">
                <label style="font-size:12px; color:var(--text-sub);">Layout JSON:</label>
                <input type="file" id="upload" accept=".json">
            </div>

            <div style="display:flex; flex-direction:column; gap:5px;">
                <label style="font-size:12px; color:var(--text-sub);">keymap.c (Optional):</label>
                <div style="display:flex; gap: 5px;">
                    <input type="file" id="keymapUpload" accept=".c">
                    <select id="layerSelect" style="display:none;"></select>
                </div>
            </div>

            <label for="boardSelect">MCU Profile:</label>
            <select id="boardSelect">
                <option value="json_file">📄 Read Pins from JSON</option>
                <option value="rp2040_zero">Raspberry Pi: RP2040-Zero</option>
                <option value="rp2040_tiny">Raspberry Pi: RP2040-Tiny</option>
                <option value="pro_micro">Arduino: Pro Micro (AVR)</option>
                <option value="nice_nano">ZMK: nice!nano (nRF52840)</option>
                <option value="nrf52840_nicenano_clone">ZMK: NRF52840 Dev Board (nice!nano v2.0 Compatible)</option>
            </select>

            <label style="margin-left: 15px; display: flex; align-items: center; gap: 5px; cursor: pointer; color: var(--text-sub); font-size: 14px; font-weight: bold;">
                <input type="checkbox" id="showWiring"> Show Wiring
            </label>

            <button id="viewToggle">👀 View: Top (Keycaps)</button>
            <button id="assignEncoderBtn" style="margin-left: 10px;">🎯 Assign Encoders: OFF</button>
            <button id="saveJsonBtn" style="margin-left: 10px; background: var(--peach, #fab387); color: #11111b; font-weight: bold; display: none;">💾 Save JSON</button>
            <button id="exportCodeBtn" style="margin-left: 5px; background: var(--green, #a6e3a1); color: #11111b; font-weight: bold; display: none;">📄 Copy C Code</button>
        </div>
    </div>

    <div id="stage"></div>
    <div id="tooltip"></div>

    <div id="codeModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:100; align-items:center; justify-content:center;">
        <div style="background:var(--bg); border:1px solid var(--key-bg); border-radius:8px; padding:20px; width:600px; max-width:90%;">
            <h3 style="margin-top:0; color:var(--text-main);">keymap.c Encoder Boilerplate</h3>
            <p style="font-size:12px; color:var(--text-sub);">Copy and paste this directly into your <code>keymap.c</code> file. Modify <code>KC_VOLU</code> and <code>KC_VOLD</code> to your desired actions.</p>
            <textarea id="codeOutput" readonly style="width:100%; height:200px; background:#11111b; color:var(--text-main); border:1px solid var(--key-bg); padding:10px; font-family:monospace; margin-bottom:10px; resize:none;"></textarea>
            <div style="display:flex; justify-content:flex-end; gap:10px;">
                <button id="copyCodeBtn" style="background:var(--accent); color:#11111b;">📋 Copy to Clipboard</button>
                <button id="closeModalBtn" style="background:var(--key-bg); color:var(--text-main);">Close</button>
            </div>
        </div>
    </div>

    <script>
        const UNIT_SIZE = 55; // 1U = 55px
        let currentJSON = null;
        let isBottomView = false;
        let parsedKeymaps = null;
        let isAssigningEncoder = false;
        let assignedEncoders = [];

        const boardProfiles = {
            "rp2040_zero": { rows: ["GP0", "GP1", "GP2", "GP3", "GP4", "GP5", "GP6"], cols: ["GP21", "GP20", "GP19", "GP18", "GP17", "GP16", "GP15", "GP14", "GP13", "GP12"], periph: { sda: "GP26", scl: "GP27", enc_a: "GP28", enc_b: "GP29", enc2_a: "GP7", enc2_b: "GP8" } },
            "rp2040_tiny": { rows: ["GP0", "GP1", "GP2", "GP3", "GP4", "GP5", "GP6"], cols: ["GP10", "GP9", "GP8", "GP7", "GP6", "GP5", "GP4", "GP3", "GP2", "GP1"], periph: { sda: "GP26", scl: "GP27", enc_a: "GP28", enc_b: "GP29", enc2_a: "GP14", enc2_b: "GP15" } },
            "pro_micro": { rows: ["D4", "C6", "D7", "E6", "B4", "B5"], cols: ["F4", "F5", "F6", "F7", "B1", "B3", "B2"], periph: { sda: "D1", scl: "D0", enc_a: "D2", enc_b: "D3", enc2_a: "B6", enc2_b: "B7" } },
            "nice_nano": { rows: ["P0.06", "P0.08", "P0.17", "P0.20", "P0.22", "P0.24"], cols: ["P0.31", "P0.29", "P0.02", "P1.15", "P1.13", "P1.11", "P0.10"], periph: { sda: "P1.04", scl: "P1.06", enc_a: "P0.09", enc_b: "P1.00", enc2_a: "P0.11", enc2_b: "P1.02" } },
            "nrf52840_nicenano_clone": { rows: ["P0.06", "P0.08", "P0.17", "P0.20", "P0.22", "P0.24"], cols: ["P0.31", "P0.29", "P0.02", "P1.15", "P1.13", "P1.11", "P0.10"], periph: { sda: "P1.04", scl: "P1.06", enc_a: "P0.09", enc_b: "P1.00", enc2_a: "P0.11", enc2_b: "P1.02" } }
        };

        const uploadInput = document.getElementById('upload');
        const keymapUpload = document.getElementById('keymapUpload');
        const layerSelect = document.getElementById('layerSelect');
        const boardSelect = document.getElementById('boardSelect');
        const viewToggle = document.getElementById('viewToggle');
        const assignEncoderBtn = document.getElementById('assignEncoderBtn');
        const showWiringCheckbox = document.getElementById('showWiring');
        const tooltip = document.getElementById('tooltip');
        const stage = document.getElementById('stage');

        assignEncoderBtn.addEventListener('click', () => {
            isAssigningEncoder = !isAssigningEncoder;
            if (isAssigningEncoder) {
                assignEncoderBtn.innerText = "🎯 Assign Encoders: ON";
                assignEncoderBtn.style.background = "var(--accent)";
                assignEncoderBtn.style.color = "#11111b";
                stage.classList.add('assigning-mode');
            } else {
                assignEncoderBtn.innerText = "🎯 Assign Encoders: OFF";
                assignEncoderBtn.style.background = "var(--key-bg)";
                assignEncoderBtn.style.color = "var(--text-main)";
                stage.classList.remove('assigning-mode');
            }
        });

        const saveJsonBtn = document.getElementById('saveJsonBtn');
        const exportCodeBtn = document.getElementById('exportCodeBtn');
        const codeModal = document.getElementById('codeModal');
        const codeOutput = document.getElementById('codeOutput');
        const copyCodeBtn = document.getElementById('copyCodeBtn');
        const closeModalBtn = document.getElementById('closeModalBtn');

        closeModalBtn.addEventListener('click', () => {
            codeModal.style.display = 'none';
        });

        copyCodeBtn.addEventListener('click', () => {
            codeOutput.select();
            document.execCommand('copy');
            copyCodeBtn.innerText = "✅ Copied!";
            setTimeout(() => copyCodeBtn.innerText = "📋 Copy to Clipboard", 2000);
        });

        exportCodeBtn.addEventListener('click', () => {
            let code = `// QMK Rotary Encoder Configuration
// Add this to your keymap.c file

#if defined(ENCODER_MAP_ENABLE)
const uint16_t PROGMEM encoder_map[][NUM_ENCODERS][NUM_DIRECTIONS] = {
    [0] = { `;
            if (assignedEncoders.length > 0) code += `ENCODER_CCW_CW(KC_VOLD, KC_VOLU)`;
            if (assignedEncoders.length > 1) code += `, ENCODER_CCW_CW(KC_PGDN, KC_PGUP)`;
            code += ` },
    // Add additional layers here if needed
    // [1] = { ENCODER_CCW_CW(KC_MEDIA_PREV_TRACK, KC_MEDIA_NEXT_TRACK) },
};
#endif

bool encoder_update_user(uint8_t index, bool clockwise) {
`;
            if (assignedEncoders.length > 0) {
                code += `    if (index == 0) {\n        if (clockwise) {\n            tap_code(KC_VOLU);\n        } else {\n            tap_code(KC_VOLD);\n        }\n    }\n`;
            }
            if (assignedEncoders.length > 1) {
                code += `    else if (index == 1) {\n        if (clockwise) {\n            tap_code(KC_PGDN);\n        } else {\n            tap_code(KC_PGUP);\n        }\n    }\n`;
            }
            code += `    return false; // Return true to let keyboard level code run\n}\n`;

            codeOutput.value = code;
            codeModal.style.display = 'flex';
        });

        saveJsonBtn.addEventListener('click', () => {
            if (!currentJSON) return;
            
            // Deep clone to avoid mutating the live state unintentionally
            let exportJSON = JSON.parse(JSON.stringify(currentJSON));
            
            const selectedProfile = boardSelect.value;
            let profilePeriph = boardProfiles[selectedProfile] ? boardProfiles[selectedProfile].periph : null;
            
            if (profilePeriph) {
                // Inject I2C if not explicitly defined
                if (!exportJSON.i2c) {
                    exportJSON.i2c = { pin_sda: profilePeriph.sda, pin_scl: profilePeriph.scl };
                }

                if (assignedEncoders.length > 0) {
                    let rotaryArr = [];
                    if (assignedEncoders.length > 0) {
                        rotaryArr.push({ pin_a: profilePeriph.enc_a, pin_b: profilePeriph.enc_b });
                    }
                    if (assignedEncoders.length > 1) {
                        rotaryArr.push({ pin_a: profilePeriph.enc2_a, pin_b: profilePeriph.enc2_b });
                    }
                    if (!exportJSON.encoder) exportJSON.encoder = {};
                    exportJSON.encoder.rotary = rotaryArr;
                }
            }

            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(exportJSON, null, 2));
            const downloadAnchorNode = document.createElement('a');
            downloadAnchorNode.setAttribute("href", dataStr);
            downloadAnchorNode.setAttribute("download", "keyboard_updated.json");
            document.body.appendChild(downloadAnchorNode);
            downloadAnchorNode.click();
            downloadAnchorNode.remove();
        });

        uploadInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(event) {
                try {
                    currentJSON = JSON.parse(event.target.result);
                    renderKeyboard();
                } catch (err) {
                    alert("Error parsing JSON. Make sure it is a valid QMK configuration file.");
                }
            };
            reader.readAsText(file);
        });

        if (keymapUpload) {
            keymapUpload.addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = function(event) {
                    parseKeymapC(event.target.result);
                    renderKeyboard();
                };
                reader.readAsText(file);
            });
        }

        if (layerSelect) {
            layerSelect.addEventListener('change', renderKeyboard);
        }

        const keycodeMap = {
            "KC_TRNS": "▽", "KC_NO": " ", "KC_TRANSPARENT": "▽",
            "KC_ESC": "ESC", "KC_TAB": "TAB", "KC_SPC": "SPACE", "KC_ENT": "ENTER",
            "KC_BSPC": "BACKSPACE", "KC_DEL": "DEL", "KC_INS": "INS",
            "KC_LCTL": "CTRL", "KC_RCTL": "CTRL", "KC_LSFT": "SHIFT", "KC_RSFT": "SHIFT",
            "KC_LALT": "ALT", "KC_RALT": "ALT", "KC_LGUI": "GUI", "KC_RGUI": "GUI",
            "KC_GRV": "`", "KC_1": "1", "KC_2": "2", "KC_3": "3", "KC_4": "4", "KC_5": "5",
            "KC_6": "6", "KC_7": "7", "KC_8": "8", "KC_9": "9", "KC_0": "0",
            "KC_MINS": "-", "KC_EQL": "=", "KC_LBRC": "[", "KC_RBRC": "]", "KC_BSLS": "\\",
            "KC_SCLN": ";", "KC_QUOT": "'", "KC_COMM": ",", "KC_DOT": ".", "KC_SLSH": "/",
            "KC_Q": "Q", "KC_W": "W", "KC_E": "E", "KC_R": "R", "KC_T": "T", "KC_Y": "Y", "KC_U": "U", "KC_I": "I", "KC_O": "O", "KC_P": "P",
            "KC_A": "A", "KC_S": "S", "KC_D": "D", "KC_F": "F", "KC_G": "G", "KC_H": "H", "KC_J": "J", "KC_K": "K", "KC_L": "L",
            "KC_Z": "Z", "KC_X": "X", "KC_C": "C", "KC_V": "V", "KC_B": "B", "KC_N": "N", "KC_M": "M",
            "KC_UP": "↑", "KC_DOWN": "↓", "KC_LEFT": "←", "KC_RGHT": "→",
            "KC_PGUP": "PGUP", "KC_PGDN": "PGDN", "KC_HOME": "HOME", "KC_END": "END",
            "KC_F1": "F1", "KC_F2": "F2", "KC_F3": "F3", "KC_F4": "F4", "KC_F5": "F5", "KC_F6": "F6",
            "KC_F7": "F7", "KC_F8": "F8", "KC_F9": "F9", "KC_F10": "F10", "KC_F11": "F11", "KC_F12": "F12",
            "KC_P1": "1", "KC_P2": "2", "KC_P3": "3", "KC_P4": "4", "KC_P5": "5", "KC_P6": "6", "KC_P7": "7", "KC_P8": "8", "KC_P9": "9", "KC_P0": "0",
            "KC_PLUS": "+", "KC_TILD": "~"
        };

        function humanizeKeycode(kc) {
            if (!kc) return "";
            if (keycodeMap[kc]) return keycodeMap[kc];
            let match = kc.match(/^(MO|TG|TO|TT|DF)\((\d+)\)$/);
            if (match) return `Layer ${match[2]}`;
            match = kc.match(/^LT\((\d+),\s*(.+)\)$/);
            if (match) return `${humanizeKeycode(match[2])} (L${match[1]})`;
            match = kc.match(/^MT\((.+),\s*(.+)\)$/);
            if (match) return `${humanizeKeycode(match[2])} (${match[1].replace('MOD_', '')})`;
            if (kc.startsWith("KC_")) return kc.substring(3);
            if (kc.startsWith("RGB_")) return kc.replace("RGB_", "🎨 ");
            return kc;
        }

        function splitArgs(str) {
            const args = [];
            let current = '';
            let depth = 0;
            let inLineComment = false;
            let inBlockComment = false;
            for (let i = 0; i < str.length; i++) {
                let char = str[i];
                let nextChar = str[i+1];
                if (inLineComment) { if (char === '\n') inLineComment = false; continue; }
                if (inBlockComment) { if (char === '*' && nextChar === '/') { inBlockComment = false; i++; } continue; }
                if (char === '/' && nextChar === '/') { inLineComment = true; i++; continue; }
                if (char === '/' && nextChar === '*') { inBlockComment = true; i++; continue; }
                if (char === '(') depth++;
                if (char === ')') depth--;
                if (char === ',' && depth === 0) {
                    args.push(current);
                    current = '';
                } else {
                    current += char;
                }
            }
            if (current.trim()) args.push(current);
            return args.map(a => a.trim().replace(/\/\*[\s\S]*?\*\//g, '').replace(/\/\/.*/g, '').trim());
        }

        function parseKeymapC(cCode) {
            parsedKeymaps = {};
            layerSelect.innerHTML = '';
            let hasLayers = false;
            
            const layerRegex = /\[\s*(\d+)\s*\]\s*=\s*LAYOUT[^\(]*\(/g;
            let match;
            while ((match = layerRegex.exec(cCode)) !== null) {
                const layerIdx = match[1];
                let startIndex = layerRegex.lastIndex;
                let depth = 1;
                let endIndex = startIndex;
                
                for (let i = startIndex; i < cCode.length; i++) {
                    if (cCode[i] === '(') depth++;
                    if (cCode[i] === ')') depth--;
                    if (depth === 0) {
                        endIndex = i;
                        break;
                    }
                }
                
                const content = cCode.substring(startIndex, endIndex);
                parsedKeymaps[layerIdx] = splitArgs(content);
                const opt = document.createElement('option');
                opt.value = layerIdx;
                opt.innerText = `Layer ${layerIdx}`;
                layerSelect.appendChild(opt);
                hasLayers = true;
            }
            if (hasLayers) {
                layerSelect.style.display = 'inline-block';
            } else {
                layerSelect.style.display = 'none';
                parsedKeymaps = null;
                alert("Could not find any LAYOUT macros in keymap.c");
            }
        }

        boardSelect.addEventListener('change', renderKeyboard);
        showWiringCheckbox.addEventListener('change', renderKeyboard);

        viewToggle.addEventListener('click', () => {
            isBottomView = !isBottomView;
            if(isBottomView) {
                viewToggle.innerText = "🛠️ View: Bottom (Wiring/Solder)";
                viewToggle.style.background = "var(--bottom-view)";
                viewToggle.style.color = "#11111b";
                stage.style.border = "2px dashed var(--bottom-view)";
                showWiringCheckbox.checked = true; // Auto-enable in bottom view
            } else {
                viewToggle.innerText = "👀 View: Top (Keycaps)";
                viewToggle.style.background = "var(--key-bg)";
                viewToggle.style.color = "var(--text-main)";
                stage.style.border = "none";
                showWiringCheckbox.checked = false; // Auto-disable in top view
            }
            renderKeyboard();
        });

        document.addEventListener('mousemove', function(e) {
            if (tooltip.style.display === 'block') {
                tooltip.style.left = (e.clientX + 15) + 'px';
                tooltip.style.top = (e.clientY + 15) + 'px';
            }
        });

        function renderKeyboard() {
            if (!currentJSON) return;

            stage.innerHTML = '';

            let layout = [];
            if (currentJSON.layouts && Object.keys(currentJSON.layouts).length > 0) {
                const firstLayoutKey = Object.keys(currentJSON.layouts)[0];
                layout = currentJSON.layouts[firstLayoutKey].layout;
            }

            let activeRows = [];
            let activeCols = [];
            const selectedProfile = boardSelect.value;

            if (selectedProfile === "json_file" && currentJSON.matrix_pins) {
                activeRows = currentJSON.matrix_pins.rows || [];
                activeCols = currentJSON.matrix_pins.cols || [];
            } else if (boardProfiles[selectedProfile]) {
                activeRows = boardProfiles[selectedProfile].rows;
                activeCols = boardProfiles[selectedProfile].cols;
            }

            // Determine actual matrix size from JSON
            let matrixRowsCount = 5; // fallback
            if (currentJSON.matrix_pins && currentJSON.matrix_pins.rows) {
                matrixRowsCount = currentJSON.matrix_pins.rows.length;
            } else {
                let max_r = 0;
                layout.forEach(k => { if(k.matrix && k.matrix[0] > max_r) max_r = k.matrix[0]; });
                matrixRowsCount = Math.floor((max_r + 1) / 2) || 5;
            }

            let sda = "N/A", scl = "N/A", enc_a = "N/A", enc_b = "N/A", enc2_a = "N/A", enc2_b = "N/A";
            
            if (currentJSON.i2c) {
                sda = currentJSON.i2c.pin_sda || currentJSON.i2c.sda || sda;
                scl = currentJSON.i2c.pin_scl || currentJSON.i2c.scl || scl;
            } else if (boardProfiles[selectedProfile] && boardProfiles[selectedProfile].periph) {
                sda = boardProfiles[selectedProfile].periph.sda;
                scl = boardProfiles[selectedProfile].periph.scl;
            }

            if (currentJSON.encoder && currentJSON.encoder.rotary && currentJSON.encoder.rotary.length > 0) {
                enc_a = currentJSON.encoder.rotary[0].pin_a || enc_a;
                enc_b = currentJSON.encoder.rotary[0].pin_b || enc_b;
                if(currentJSON.encoder.rotary.length > 1) {
                    enc2_a = currentJSON.encoder.rotary[1].pin_a || enc2_a;
                    enc2_b = currentJSON.encoder.rotary[1].pin_b || enc2_b;
                }
            } else if (boardProfiles[selectedProfile] && boardProfiles[selectedProfile].periph) {
                enc_a = boardProfiles[selectedProfile].periph.enc_a;
                enc_b = boardProfiles[selectedProfile].periph.enc_b;
                enc2_a = boardProfiles[selectedProfile].periph.enc2_a || "N/A";
                enc2_b = boardProfiles[selectedProfile].periph.enc2_b || "N/A";
            }

            // Pass 1: Find physical board width to calculate mirroring
            let max_x_logical = 0;
            let max_y = 0;
            layout.forEach(key => {
                const x = key.x || 0;
                const y = key.y || 0;
                const w = key.w || 1;
                const h = key.h || 1;
                if (x + w > max_x_logical) max_x_logical = x + w;
                if (y + h > max_y) max_y = y + h;
            });

            // Pass 2: Draw keys
            let rowGroups = {};
            let colGroups = {};
            let encoderPositions = [];

            layout.forEach((key, index) => {
                const div = document.createElement('div');
                div.className = 'key';

                const original_x = key.x || 0;
                const y = key.y || 0;
                const w = key.w || 1;
                const h = key.h || 1;

                // If Bottom View is active, flip the X coordinate horizontally
                let draw_x = original_x;
                if (isBottomView) {
                    draw_x = max_x_logical - original_x - w;
                }

                div.style.left = (draw_x * UNIT_SIZE) + 'px';
                div.style.top = (y * UNIT_SIZE) + 'px';
                div.style.width = (w * UNIT_SIZE) + 'px';
                div.style.height = (h * UNIT_SIZE) + 'px';

                let rowPin = "N/A";
                let colPin = "N/A";

                let keycode = "";
                if (parsedKeymaps && layerSelect.value && parsedKeymaps[layerSelect.value]) {
                    keycode = parsedKeymaps[layerSelect.value][index] || "";
                }

                if (key.matrix) {
                    const r = key.matrix[0];
                    const c = key.matrix[1];
                    
                    // Use matrixRowsCount to normalize, NOT activeRows.length
                    const side = r >= matrixRowsCount ? 1 : 0;
                    const normalizedRow = r >= matrixRowsCount ? r - matrixRowsCount : r;

                    rowPin = activeRows[normalizedRow] || "N/A";
                    colPin = activeCols[c] || "N/A";

                    const cx = (draw_x * UNIT_SIZE) + (w * UNIT_SIZE / 2);
                    const cy = (y * UNIT_SIZE) + (h * UNIT_SIZE / 2);
                    
                    const rowKey = side + "_" + normalizedRow;
                    const colKey = side + "_" + c;

                    let rowKeyForEnc = r + "_" + c;
                    let encIdx = assignedEncoders.indexOf(rowKeyForEnc);
                    let isEncoder = encIdx !== -1;

                    // Only push to matrix SVG lines if it's NOT an encoder
                    if (!isEncoder) {
                        if (!rowGroups[rowKey]) rowGroups[rowKey] = [];
                        if (!colGroups[colKey]) colGroups[colKey] = [];

                        rowGroups[rowKey].push({x: cx, y: cy});
                        colGroups[colKey].push({x: cx, y: cy});
                    }

                    if (isEncoder) {
                        encoderPositions.push({x: cx, y: cy, idx: encIdx});
                        div.classList.add('encoder-key');
                        div.style.width = Math.min(w * UNIT_SIZE, h * UNIT_SIZE) + 'px';
                        div.style.height = div.style.width;
                        const diffW = (w * UNIT_SIZE) - parseFloat(div.style.width);
                        const diffH = (h * UNIT_SIZE) - parseFloat(div.style.height);
                        div.style.left = (draw_x * UNIT_SIZE + diffW/2) + 'px';
                        div.style.top = (y * UNIT_SIZE + diffH/2) + 'px';
                        div.innerHTML = `<div style="font-size:24px;">🔄</div>`;
                    } else if (!isBottomView && keycode) {
                        div.innerHTML = `<div class="keycode" title="${keycode}">${humanizeKeycode(keycode)}</div><div class="pins" style="color:var(--text-sub)">[${r}, ${c}]</div>`;
                    } else {
                        div.innerHTML = `<div class="matrix">[${r}, ${c}]</div><div class="pins">${rowPin} | ${colPin}</div>`;
                    }

                    div.addEventListener('click', () => {
                        if (isAssigningEncoder) {
                            if (isEncoder) {
                                assignedEncoders = assignedEncoders.filter(e => e !== rowKeyForEnc);
                            } else {
                                if(assignedEncoders.length < 2) {
                                    assignedEncoders.push(rowKeyForEnc);
                                } else {
                                    alert("Maximum 2 encoders supported currently.");
                                }
                            }
                            renderKeyboard();
                        }
                    });
                } else {
                    if (!isBottomView && keycode) {
                        div.innerHTML = `<div class="keycode" title="${keycode}">${humanizeKeycode(keycode)}</div>`;
                    }
                }

                div.addEventListener('mouseenter', () => {
                    let sideText = "N/A";
                    let viewState = isBottomView ? "\n(MIRRORED FOR SOLDERING)" : "";
                    let kcText = (!isBottomView && keycode) ? `\nKeycode: 👉 **${keycode}**\n` : "";
                    let matrixText = "N/A";
                    
                    if (key.matrix) {
                        sideText = (key.matrix[0] >= matrixRowsCount) ? "RIGHT HALF" : "LEFT HALF";
                        matrixText = `[${key.matrix[0]}, ${key.matrix[1]}]`;
                        let encIdx = assignedEncoders.indexOf(key.matrix[0] + "_" + key.matrix[1]);
                        if (encIdx !== -1) {
                            let ea = encIdx === 0 ? enc_a : enc2_a;
                            let eb = encIdx === 0 ? enc_b : enc2_b;
                            tooltip.innerHTML = `📍 **Encoder ${encIdx+1}** (${sideText}) ${viewState}\nMatrix [Row, Col]: ${matrixText} (Click Switch)\n\nSolder Click Row to: 👉 **${rowPin}**\nSolder Click Col to: 👉 **${colPin}**\n\nSolder Rotary Pin A: 👉 **${ea}**\nSolder Rotary Pin B: 👉 **${eb}**`;
                        } else {
                            tooltip.innerHTML = `📍 **${key.label || 'KEY'}** (${sideText}) ${viewState}${kcText}\nMatrix [Row, Col]: ${matrixText}\n\nSolder Row to:   👉 **${rowPin}**\nSolder Col to:   👉 **${colPin}**`;
                        }
                    } else {
                        tooltip.innerHTML = `📍 **${key.label || 'KEY'}** (${sideText}) ${viewState}${kcText}\nMatrix [Row, Col]: ${matrixText}\n\nSolder Row to:   👉 **${rowPin}**\nSolder Col to:   👉 **${colPin}**`;
                    }
                    tooltip.style.display = 'block';
                });
                div.addEventListener('mouseleave', () => {
                    tooltip.style.display = 'none';
                });

                stage.appendChild(div);
            });

            // Draw Wiring SVG if enabled
            if (showWiringCheckbox.checked) {
                const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
                svg.style.position = "absolute";
                svg.style.top = "0";
                svg.style.left = "0";
                svg.style.width = "100%";
                svg.style.height = "100%";
                svg.style.pointerEvents = "none";
                svg.style.zIndex = "1"; // Keep under the keys which hover at 10

                const ribbonColors = [
                    "rgba(180, 98, 77, 0.85)",    // Brown
                    "rgba(243, 139, 168, 0.85)",  // Red 
                    "rgba(250, 179, 135, 0.85)",  // Orange 
                    "rgba(249, 226, 175, 0.85)",  // Yellow 
                    "rgba(166, 227, 161, 0.85)",  // Green 
                    "rgba(137, 180, 250, 0.85)",  // Blue 
                    "rgba(203, 166, 247, 0.85)",  // Violet 
                    "rgba(186, 194, 222, 0.85)",  // Gray 
                    "rgba(255, 255, 255, 0.85)"   // White 
                ];
                let colorIndex = 0;

                // Draw Rows
                Object.values(rowGroups).forEach(group => {
                    group.sort((a, b) => a.x - b.x); // Connect horizontally
                    let points = group.map(p => `${p.x},${p.y}`).join(" ");
                    let poly = document.createElementNS("http://www.w3.org/2000/svg", "polyline");
                    poly.setAttribute("points", points);
                    poly.setAttribute("fill", "none");
                    poly.setAttribute("stroke", ribbonColors[colorIndex % ribbonColors.length]);
                    poly.setAttribute("stroke-width", "4");
                    poly.setAttribute("stroke-linejoin", "round");
                    svg.appendChild(poly);
                    colorIndex++;
                });

                // Draw Cols
                Object.values(colGroups).forEach(group => {
                    group.sort((a, b) => a.y - b.y); // Connect vertically
                    let points = group.map(p => `${p.x},${p.y}`).join(" ");
                    let poly = document.createElementNS("http://www.w3.org/2000/svg", "polyline");
                    poly.setAttribute("points", points);
                    poly.setAttribute("fill", "none");
                    poly.setAttribute("stroke", ribbonColors[colorIndex % ribbonColors.length]);
                    poly.setAttribute("stroke-width", "4");
                    poly.setAttribute("stroke-linejoin", "round");
                    svg.appendChild(poly);
                    colorIndex++;
                });

                // Draw Encoder Rotary Pins (A/B)
                encoderPositions.forEach(pos => {
                    let y_offset = 35; 
                    
                    // Pin A
                    let polyA = document.createElementNS("http://www.w3.org/2000/svg", "line");
                    polyA.setAttribute("x1", pos.x - 12);
                    polyA.setAttribute("y1", pos.y);
                    polyA.setAttribute("x2", pos.x - 12);
                    polyA.setAttribute("y2", pos.y + y_offset);
                    polyA.setAttribute("stroke", "var(--peach, #fab387)");
                    polyA.setAttribute("stroke-width", "4");
                    polyA.setAttribute("stroke-dasharray", "6,4");
                    svg.appendChild(polyA);

                    // Pin B
                    let polyB = document.createElementNS("http://www.w3.org/2000/svg", "line");
                    polyB.setAttribute("x1", pos.x + 12);
                    polyB.setAttribute("y1", pos.y);
                    polyB.setAttribute("x2", pos.x + 12);
                    polyB.setAttribute("y2", pos.y + y_offset);
                    polyB.setAttribute("stroke", "var(--peach, #fab387)");
                    polyB.setAttribute("stroke-width", "4");
                    polyB.setAttribute("stroke-dasharray", "6,4");
                    svg.appendChild(polyB);
                });

                stage.appendChild(svg);
            }

            // Add extra width to ensure the Peripherals Panel doesn't overlap the keys
            stage.style.width = (max_x_logical * UNIT_SIZE + 280) + 'px';
            stage.style.height = Math.max(max_y * UNIT_SIZE + 20, 250) + 'px';

            // Render Hardware Peripherals Panel
            const periphPanel = document.createElement('div');
            periphPanel.className = 'peripherals-panel';
            periphPanel.innerHTML = `
                <div style="font-weight:bold; border-bottom:1px solid #313244; padding-bottom:5px; margin-bottom:5px;">🔌 Hardware Peripherals</div>
                <div class="peripheral-item">
                    <div class="peripheral-title">OLED Display (I2C)</div>
                    <div class="peripheral-pin">SDA Pin: <strong>${sda}</strong></div>
                    <div class="peripheral-pin">SCL Pin: <strong>${scl}</strong></div>
                </div>
                <div class="peripheral-item">
                    <div class="peripheral-title">Rotary Encoder</div>
                    <div class="peripheral-pin">Pin A: <strong>${enc_a}</strong></div>
                    <div class="peripheral-pin">Pin B: <strong>${enc_b}</strong></div>
                </div>
            `;
            stage.appendChild(periphPanel);
            
            saveJsonBtn.style.display = "inline-block";
            if (assignedEncoders.length > 0) {
                exportCodeBtn.style.display = "inline-block";
            } else {
                exportCodeBtn.style.display = "none";
            }
        }
    </script>
</body>
</html>
